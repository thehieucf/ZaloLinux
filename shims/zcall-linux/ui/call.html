<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src * data:; style-src 'self' 'unsafe-inline'">
<title>Zalo Call</title>
<style>
  :root {
    --bg: #0b1b33; --bg2: #13294b; --fg: #f2f6fc; --muted: #9fb3d1;
    --accept: #22c55e; --decline: #ef4444; --btn: #24406b;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Inter", "Noto Sans", system-ui, sans-serif; color: var(--fg);
    background: radial-gradient(120% 80% at 50% 0%, var(--bg2), var(--bg));
    display: flex; flex-direction: column; align-items: center; padding: 48px 24px 32px;
    user-select: none;
  }
  .avatar {
    width: 112px; height: 112px; border-radius: 50%; object-fit: cover;
    background: var(--btn); box-shadow: 0 0 0 6px rgba(255,255,255,.06);
  }
  body[data-state="ringing"] .avatar, body[data-state="alerting"] .avatar { animation: pulse 1.6s ease-out infinite; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(34,197,94,.45); }
    100% { box-shadow: 0 0 0 26px rgba(34,197,94,0); }
  }
  h1 { font-size: 22px; font-weight: 600; margin-top: 22px; text-align: center; }
  .status { color: var(--muted); font-size: 14px; margin-top: 8px; min-height: 1.4em; text-align: center; }
  .timer { font-variant-numeric: tabular-nums; }
  .spacer { flex: 1; }
  .actions { display: flex; gap: 32px; }
  .action { display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
  button {
    width: 64px; height: 64px; border-radius: 50%; border: 0; cursor: pointer; color: #fff;
    background: var(--btn); display: grid; place-items: center; transition: transform .1s, filter .1s;
  }
  button:hover { filter: brightness(1.12); }
  button:active { transform: scale(.94); }
  button svg { width: 28px; height: 28px; fill: currentColor; }
  .accept { background: var(--accept); }
  .decline, .hangup { background: var(--decline); }
  .decline svg, .hangup svg { transform: rotate(135deg); }
  .mute[aria-pressed="true"], .camera[aria-pressed="true"], .share[aria-pressed="true"] { background: #fff; color: var(--bg); }
  /* Video calls: the partner's picture fills the window, our camera sits in a corner. */
  .remote { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
  .local {
    position: fixed; top: 16px; right: 16px; width: 120px; height: 160px; object-fit: cover; z-index: 2;
    border-radius: 12px; background: #000; transform: scaleX(-1); box-shadow: 0 4px 16px rgba(0,0,0,.5);
  }
  .local.screen { transform: none; object-fit: contain; width: 160px; height: 90px; }
  .avatar, h1, .status, .spacer, .actions { position: relative; z-index: 1; }
  body.has-video .avatar { visibility: hidden; }
  body.has-video h1, body.has-video .status, body.has-video .action { text-shadow: 0 1px 4px #000; }
  [hidden] { display: none !important; }
</style>
</head>
<body data-state="ringing">
  <canvas class="remote" id="remote" hidden></canvas>
  <video class="local" id="local" muted autoplay playsinline hidden></video>
  <img class="avatar" id="avatar" alt="">
  <h1 id="name">Zalo</h1>
  <div class="status" id="status">Cuộc gọi đến…</div>
  <div class="spacer"></div>

  <div class="actions" id="ringing-actions">
    <div class="action">
      <button class="decline" id="decline" title="Từ chối"><svg viewBox="0 0 24 24"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1l-2.3 2.2z"/></svg></button>
      Từ chối
    </div>
    <div class="action">
      <button class="accept" id="accept" title="Trả lời"><svg viewBox="0 0 24 24"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1l-2.3 2.2z"/></svg></button>
      Trả lời
    </div>
  </div>

  <div class="actions" id="call-actions" hidden>
    <div class="action">
      <button class="mute" id="mute" aria-pressed="false" title="Tắt micro"><svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V21h2v-3.1A7 7 0 0 0 19 11h-2z"/></svg></button>
      Micro
    </div>
    <div class="action" id="camera-action" hidden>
      <button class="camera" id="camera" aria-pressed="false" title="Tắt camera"><svg viewBox="0 0 24 24"><path d="M17 10.5V7a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-3.5l4 4v-11l-4 4z"/></svg></button>
      Camera
    </div>
    <div class="action" id="share-action" hidden>
      <button class="share" id="share" aria-pressed="false" title="Chia sẻ màn hình"><svg viewBox="0 0 24 24"><path d="M20 3H4a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h5v2H7v2h10v-2h-2v-2h5a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm0 13H4V5h16v11zm-8-9-4 4h3v4h2v-4h3l-4-4z"/></svg></button>
      Màn hình
    </div>
    <div class="action">
      <button class="hangup" id="hangup" title="Kết thúc"><svg viewBox="0 0 24 24"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1l-2.3 2.2z"/></svg></button>
      Kết thúc
    </div>
  </div>
<script src="call-ui.js"></script>
</body>
</html>
